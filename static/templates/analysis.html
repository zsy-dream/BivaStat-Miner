<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>结果分析 - 双变量关联挖掘与非参数统计分析平台</title>
<link rel="stylesheet" href="/static/css/style.css">
<link rel="stylesheet" href="/static/css/theme.css">
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
<div class="container">
<header class="header">
<h1>结果分析</h1>
<nav class="nav">
<a href="/">首页</a>
<a href="/data">数据管理</a>
<a href="/algorithm">算法配置</a>
<a href="/analysis" class="active">结果分析</a>
<a href="/report">报告生成</a>
</nav>
</header>
<main class="main-content">
<section class="analysis-controls">
<h2>分析控制面板</h2>
<div class="control-group">
<label for="chart-type">图表类型：</label>
<select id="chart-type">
<option value="heatmap">热力图</option>
<option value="scatter">散点图</option>
<option value="bar">柱状图</option>
</select>
<button id="generate-chart-btn" class="btn-primary">生成图表</button>
</div>
<div class="control-group">
<label for="export-format">导出格式：</label>
<select id="export-format">
<option value="csv">CSV</option>
<option value="json">JSON</option>
<option value="excel">Excel</option>
</select>
<button id="export-results-btn" class="btn-secondary">导出结果</button>
</div>
</section>
<section class="visualization-container">
<h2>可视化结果</h2>
<div id="chart-container" class="chart-area">
<div id="plot" class="plot-placeholder">等待生成图表...</div>
</div>
</section>
<section class="results-summary">
<h2>分析结果摘要</h2>
<div class="summary-grid">
<div class="summary-item">
<h3>关联规则数量</h3>
<p id="rule-count">-</p>
</div>
<div class="summary-item">
<h3>显著关联数量</h3>
<p id="significant-count">-</p>
</div>
<div class="summary-item">
<h3>平均置信度</h3>
<p id="avg-confidence">-</p>
</div>
<div class="summary-item">
<h3>平均支持度</h3>
<p id="avg-support">-</p>
</div>
</div>
<div class="summary-details">
<h3>详细规则列表</h3>
<div class="table-container">
<table id="rules-table">
<thead>
<tr>
<th>规则ID</th>
<th>前项</th>
<th>后项</th>
<th>支持度</th>
<th>置信度</th>
<th>提升度</th>
<th>P值</th>
</tr>
</thead>
<tbody>
<tr>
<td colspan="7" class="loading-text">加载中...</td>
</tr>
</tbody>
</table>
</div>
</div>
</section>
<section class="statistical-tests">
<h2>非参数统计检验</h2>
<div class="test-controls">
<select id="test-type">
<option value="mann-whitney">Mann-Whitney U检验</option>
<option value="wilcoxon">Wilcoxon符号秩检验</option>
<option value="kruskal-wallis">Kruskal-Wallis检验</option>
<option value="friedman">Friedman检验</option>
</select>
<button id="run-test-btn" class="btn-primary">运行检验</button>
</div>
<div id="test-results" class="test-results-area">
<p>选择检验类型并点击运行查看结果</p>
</div>
</section>
</main>
<footer class="footer">
<p>&copy; 2023 双变量关联挖掘与非参数统计分析平台 V1.0</p>
</footer>
</div>
<script src="/static/js/data.js"></script>
<script src="/static/js/chart.js"></script>
<script src="/static/js/main.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
const generateChartBtn = document.getElementById('generate-chart-btn');
const exportResultsBtn = document.getElementById('export-results-btn');
const runTestBtn = document.getElementById('run-test-btn');
if (generateChartBtn) generateChartBtn.addEventListener('click', generateChart);
if (exportResultsBtn) exportResultsBtn.addEventListener('click', exportResults);
if (runTestBtn) runTestBtn.addEventListener('click', runStatisticalTest);
loadAnalysisResults();
});
function generateChart() {
const chartType = document.getElementById('chart-type').value;
const chartContainer = document.getElementById('plot');
chartContainer.innerHTML = '<div class="loading">生成图表中...</div>';
fetch('/api/analysis/generate_chart', {
method: 'POST',
headers: {
'Content-Type': 'application/json',
},
body: JSON.stringify({
chart_type: chartType,
data: typeof currentAnalysisData !== 'undefined' ? currentAnalysisData : {}
})
})
.then(response => response.json())
.then(data => {
if (data.success) {
chartContainer.innerHTML = '';
ChartLib.render('plot', chartType, data.chart_data);
} else {
showError('图表生成失败: ' + data.error);
chartContainer.innerHTML = `<div class="error">图表生成失败: ${data.error}</div>`;
}
})
.catch(error => {
showError('生成图表时发生错误: ' + error.message);
chartContainer.innerHTML = `<div class="error">发生错误: ${error.message}</div>`;
});
}
function exportResults() {
const format = document.getElementById('export-format').value;
fetch('/api/analysis/export_results', {
method: 'POST',
headers: {
'Content-Type': 'application/json',
},
body: JSON.stringify({
format: format,
data: currentAnalysisData
})
})
.then(response => {
if (response.ok) {
return response.blob();
}
return response.json().then(err => { throw new Error(err.error); });
})
.then(blob => {
const url = window.URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
a.download = `analysis_results.${format}`;
document.body.appendChild(a);
a.click();
window.URL.revokeObjectURL(url);
a.remove();
})
.catch(error => {
showError('导出结果时发生错误: ' + error.message);
});
}
function loadAnalysisResults() {
fetch('/api/analysis/get_results')
.then(response => response.json())
.then(data => {
if (data.success) {
currentAnalysisData = data.data;
updateSummary(data.data.summary);
populateRulesTable(data.data.rules);
} else {
showError('加载分析结果失败: ' + data.error);
}
})
.catch(error => {
showError('加载分析结果时发生错误: ' + error.message);
});
}
function updateSummary(summary) {
document.getElementById('rule-count').textContent = summary.total_rules;
document.getElementById('significant-count').textContent = summary.significant_rules;
document.getElementById('avg-confidence').textContent = summary.avg_confidence.toFixed(4);
document.getElementById('avg-support').textContent = summary.avg_support.toFixed(4);
}
function populateRulesTable(rules) {
const tbody = document.querySelector('#rules-table tbody');
tbody.innerHTML = '';
if (rules.length === 0) {
tbody.innerHTML = '<tr><td colspan="7" class="no-data">暂无数据</td></tr>';
return;
}
rules.forEach(rule => {
const row = tbody.insertRow();
row.innerHTML = `
<td>${rule.id}</td>
<td>${rule.antecedent}</td>
<td>${rule.consequent}</td>
<td>${rule.support.toFixed(4)}</td>
<td>${rule.confidence.toFixed(4)}</td>
<td>${rule.lift.toFixed(4)}</td>
<td>${rule.p_value.toFixed(4)}</td>
`;
});
}
function runStatisticalTest() {
const testType = document.getElementById('test-type').value;
const resultsArea = document.getElementById('test-results');
resultsArea.innerHTML = '<div class="loading">运行统计检验中...</div>';
fetch('/api/analysis/run_test', {
method: 'POST',
headers: {
'Content-Type': 'application/json',
},
body: JSON.stringify({
test_type: testType,
data: currentAnalysisData
})
})
.then(response => response.json())
.then(data => {
if (data.success) {
displayTestResults(data.results);
} else {
showError('统计检验失败: ' + data.error);
}
})
.catch(error => {
showError('运行统计检验时发生错误: ' + error.message);
});
}
function displayTestResults(results) {
const resultsArea = document.getElementById('test-results');
resultsArea.innerHTML = `
<div class="test-result-item">
<h4>检验类型: ${results.test_name}</h4>
<p><strong>统计量:</strong> ${results.statistic.toFixed(4)}</p>
<p><strong>P值:</strong> ${results.p_value.toFixed(4)}</p>
<p><strong>结论:</strong> ${results.conclusion}</p>
${results.confidence_interval ?
`<p><strong>置信区间:</strong> [${results.confidence_interval[0].toFixed(4)}, ${results.confidence_interval[1].toFixed(4)}]</p>` :
''}
</div>
`;
}
function showError(message) {
const errorDiv = document.createElement('div');
errorDiv.className = 'error-message';
errorDiv.textContent = message;
document.querySelector('.main-content').insertBefore(errorDiv, document.querySelector('.main-content').firstChild);
setTimeout(() => {
errorDiv.remove();
}, 5000);
}
</script>
</body>
</html>
