<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>生成分析报告</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/theme.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">📄 报告生成中心</div>
            <nav class="nav">
                <a href="/">返回首页</a>
            </nav>
        </header>

        <main class="main-content">
            <div class="section">
                <h2>生成新报告</h2>
                <div class="form-group">
                    <label class="form-label">报告标题</label>
                    <input type="text" id="title" class="form-control" value="数据挖掘分析报告">
                </div>

                <button id="genBtn" class="btn btn-primary" onclick="generateReport()">🚀 生成报告</button>

                <div id="resultArea" style="display: none; margin-top: 20px; padding: 20px; border: 2px solid #10b981; border-radius: 8px; background: #ecfdf5;">
                    <h3 style="color: #059669; margin-top: 0;">✅ 生成成功！</h3>
                    <p>如果浏览器没有自动下载，请点击下方按钮：</p>
                    <a id="downloadLink" href="#" class="btn btn-green" target="_blank" style="background: #059669; color: white; text-decoration: none; padding: 10px 20px; border-radius: 5px; display: inline-block;">
                        📥 点击下载 HTML 报告
                    </a>
                </div>

                <div id="errorArea" style="display: none; margin-top: 20px; padding: 15px; border: 1px solid #ef4444; background: #fef2f2; color: #b91c1c; border-radius: 5px;"></div>
            </div>
        </main>
    </div>

    <script>
        function generateReport() {
            const btn = document.getElementById('genBtn');
            const resultArea = document.getElementById('resultArea');
            const errorArea = document.getElementById('errorArea');

            // 重置状态
            resultArea.style.display = 'none';
            errorArea.style.display = 'none';
            btn.disabled = true;
            btn.innerText = "⏳ 正在生成...";

            fetch('/api/report/generate_report', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    title: document.getElementById('title').value
                })
            })
            .then(r => r.json())
            .then(res => {
                btn.disabled = false;
                btn.innerText = "🚀 生成报告";

                if(res.success) {
                    // 显示下载区域
                    resultArea.style.display = 'block';
                    const link = document.getElementById('downloadLink');
                    link.href = `/api/report/download_report/${res.report_id}`;

                    // 尝试自动点击
                    link.click();
                } else {
                    errorArea.style.display = 'block';
                    errorArea.innerText = "❌ 生成失败: " + (res.error || "未知错误");
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.innerText = "🚀 生成报告";
                errorArea.style.display = 'block';
                errorArea.innerText = "❌ 网络错误: " + err;
            });
        }
    </script>
</body>
</html>
