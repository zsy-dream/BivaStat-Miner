<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; }
        h1 { color: #2c3e50; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .meta { color: #666; font-size: 0.9em; margin-bottom: 20px; }
        .metric-card { background: #f8f9fa; padding: 15px; margin-bottom: 10px; border-radius: 5px; border-left: 4px solid #3498db; }
        .highlight { font-weight: bold; color: #e74c3c; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>{{ title }}</h1>
    <div class="meta">生成时间: {{ generated_at }}</div>

    <h2>关键指标摘要</h2>
    <div class="metric-card">
        <p>挖掘到的关联规则总数: <strong>{{ total_rules }}</strong></p>
    </div>
    <div class="metric-card">
        <p>执行的统计检验次数: <strong>{{ total_tests }}</strong></p>
    </div>

    <h2>显著性检验详情</h2>
    <table>
        <thead>
            <tr>
                <th>检验类型</th>
                <th>P值</th>
                <th>结果</th>
            </tr>
        </thead>
        <tbody>
            {% for metric in metrics %}
            <tr>
                <td>{{ metric.test }}</td>
                <td>{{ "%.4f"|format(metric.p_value) }}</td>
                <td class="{{ 'highlight' if metric.significant else '' }}">
                    {{ '显著' if metric.significant else '不显著' }}
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
